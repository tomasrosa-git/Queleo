name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # next.config.ts corta el arranque si falta, porque la URL se incrusta en
    # el bundle. La necesitan tanto typegen como build; acá sólo se verifica
    # que compile.
    env:
      NEXT_PUBLIC_API_URL: https://queleo-api.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # typecheck genera antes los tipos de rutas: LayoutProps y PageProps son
      # globales que Next escribe dentro de .next/, que no se versiona, así que
      # un tsc pelado no los encuentra en un checkout limpio.
      - run: pnpm run typecheck
      - run: pnpm exec eslint .
      - run: pnpm run build
